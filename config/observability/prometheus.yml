global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          exporter: cadvisor

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          exporter: node-exporter
